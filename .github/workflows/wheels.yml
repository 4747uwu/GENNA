name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# `pip install genna` must never need a C compiler. That means a prebuilt
# wheel per platform, each one import-tested and round-trip-tested on the
# platform it was built for before it is allowed near PyPI.
#
# This workflow was present from the initial commit and GitHub never
# registered it -- it did not appear in the Actions sidebar or in
# /actions/workflows, so "Run workflow" was not offered and it could not be
# dry-run. Touching the file forces a re-scan on the next push.
jobs:
  build:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel, not macos-13: the macOS 13 image was retired on
        # 8 December 2025, and a job asking for a retired label does not
        # fail -- it sits QUEUED forever, rendering as "pending" rather than
        # broken. This one waited 85 minutes while every sibling job in the
        # same run finished. Same shape as the rest: a thing that cannot run
        # looks identical to a thing that is fine.
        #
        # macos-15-intel is GitHub's last x86_64 macOS image and is scheduled
        # to go away in AUGUST 2027. When it does, Intel Macs fall back to
        # building from the sdist, which needs Xcode CLT.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        # One wheel per platform, not one per Python. The library is loaded
        # with ctypes rather than the CPython C-API, so setup.py tags it
        # py3-none-<platform> and a single build serves every 3.x.
        env:
          CIBW_BUILD: cp311-*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pipx run build --sdist
      - name: The sdist must contain the C engine
        # A published sdist missing src/ installs cleanly and then fails at
        # build time with "Genna C sources not found" -- after the user has
        # already waited for the download.
        run: |
          python - <<'PY'
          import glob, re, tarfile, sys
          t = tarfile.open(glob.glob('dist/*.tar.gz')[0])
          names = t.getnames()
          need = ['genna_engine3.c', 'genna_ext.c', 'genna_dict2.c',
                  'genna_persist.c', 'genna_capi.c', 'genna_bin.c',
                  'genna_merge.c']
          missing = [f for f in need
                     if not any(n.endswith('/src/' + f) for n in names)]
          headers = [n for n in names if re.search(r'/include/.*\.h$', n)]
          if missing or not headers:
              sys.exit('sdist incomplete: missing %s, %d headers'
                       % (missing, len(headers)))
          print('sdist ok: %d headers, all %d sources' % (len(headers), len(need)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    # Only on a version tag, and only if every wheel and the sdist passed.
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # PyPI trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
