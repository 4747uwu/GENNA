name: ci

on:
  push:
    # The default branch here is master, not main. This said [main] from the
    # first commit, so every push silently matched nothing and this workflow
    # had never run once -- the repo looked CI-covered and was not.
    branches: [master]
  pull_request:
  workflow_dispatch:

# The point of this workflow is that Genna's numbers were all measured on
# Windows. Until it builds and passes on Linux on a machine nobody owns, the
# cross-platform claim is not evidence, it is an intention.
jobs:
  c-engine:
    name: C engine ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib + zstd
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y zlib1g-dev libzstd-dev
          else
            brew install zstd || true
          fi

      - name: Build and test
        run: make ci CC=cc

      - name: Build under ASan + UBSan
        run: |
          make clean
          make ci CC=cc \
            CFLAGS="-O1 -g -D_GNU_SOURCE -Iinclude -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install zlib + zstd (unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev libzstd-dev
          else
            brew install zstd || true
          fi

      - name: The link probe must be able to fail
        # A probe that always passes is why `pip install .` died on Ubuntu
        # 24.04 with a non-PIC relocation error after the probe said the
        # static archive was fine. On Linux this asserts the probe now
        # REJECTS a non-PIC archive; on Windows/macOS that check is reported
        # n/a rather than counted as a pass.
        run: python tools/probe_selftest.py

      - name: Install (builds the native library from source)
        run: python -m pip install -v .

      - name: Smoke test the installed package
        # Run from a different directory so a working import cannot be the
        # repo's own python/ directory shadowing the installed package.
        working-directory: ${{ runner.temp }}
        run: python ${{ github.workspace }}/python/tests/smoke_wheel.py

      - name: The packaged demo must run on every platform
        working-directory: ${{ runner.temp }}
        run: genna-demo --rows 2000

      - name: Full Python suite
        # Each of these is a standalone script with its own checks and exit
        # code, not pytest -- so they run with whatever interpreter is here.
        # test_semantic is excluded on purpose: it downloads a real
        # sentence-transformer, which is not a thing to do on every push.
        shell: bash
        run: |
          python -m pip install "pyarrow>=12" "numpy>=1.21" || echo "extras unavailable; table/sketch will report SKIP"
          cd python
          rc=0
          for t in tests/test_core.py tests/test_threads.py tests/test_query.py \
                   tests/test_lazy.py tests/test_table.py tests/test_sketch.py \
                   tests/test_demo.py; do
            echo "=== $t"
            python "$t" || rc=1
          done
          exit $rc
