name: ci

on:
  push:
    # The default branch here is master, not main. This said [main] from the
    # first commit, so every push silently matched nothing and this workflow
    # had never run once -- the repo looked CI-covered and was not.
    branches: [master]
  pull_request:
  workflow_dispatch:

# The point of this workflow is that Genna's numbers were all measured on
# Windows. Until it builds and passes on Linux on a machine nobody owns, the
# cross-platform claim is not evidence, it is an intention.
jobs:
  c-engine:
    name: C engine ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib + zstd
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y zlib1g-dev libzstd-dev
          else
            brew list zstd || brew install zstd
          fi

      # One step per binary, for the same reason the Python suite is split:
      # GitHub 403s on workflow logs without a token, so the only public
      # signal is the step NAME. As a single `make ci`, a failure in any of
      # 8 compiles and 9 runs printed "Build and test failed" and nothing
      # more -- which is why macos-latest has been red and undiagnosed.
      # macOS c/compile is red and its text is unreadable without a token, so
      # these probes encode the diagnosis in step NAMES, which are public.
      # If `plain` fails while `brew-prefix` passes, the cause is that
      # Homebrew installs to /opt/homebrew on arm64 and that is not on
      # clang's default include/lib search path -- nothing to do with whether
      # zstd is present. Diagnosis only; no build flags change in this commit.
      - name: mac/brew-zstd-installed
        if: runner.os == 'macOS'
        run: brew list zstd
      - name: mac/zstd-header-with-brew-prefix
        if: always() && runner.os == 'macOS'
        run: echo '#include <zstd.h>' | cc -fsyntax-only -xc -I"$(brew --prefix)/include" -
      - name: mac/zlib-header-plain
        if: always() && runner.os == 'macOS'
        run: echo '#include <zlib.h>' | cc -fsyntax-only -xc -
      - name: mac/link-zstd-with-brew-prefix
        if: always() && runner.os == 'macOS'
        run: printf '#include <zstd.h>\nint main(void){return (int)ZSTD_compressBound(64);}\n' | cc -xc - -I"$(brew --prefix)/include" -L"$(brew --prefix)/lib" -lzstd -o /tmp/zb

      - name: c/compile
        if: always()
        run: make ci-build CC=cc

      - name: c/test_genna
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/test_genna ./test_genna
      - name: c/edge
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/edge ./edge
      - name: c/fuzz_test
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/fuzz_test ./fuzz_test
      - name: c/merge_test
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/merge_test ./merge_test
      - name: c/agg_test
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/agg_test ./agg_test 4
      - name: c/persist_write
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/persist_write ./persist_test write sample_ml_dataset.jsonl gn_store.gn gn_ref.bin
      - name: c/persist_verify
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/persist_verify ./persist_test verify gn_store.gn gn_ref.bin
      - name: c/crash_test
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/crash_test ./crash_test parent gn_crash.gn gn_witness.txt sample_ml_dataset.jsonl 3 200
      - name: c/oocore_test
        if: always()
        shell: bash
        run: bash tools/ci_run.sh c/oocore_test ./oocore_test . 8 keep

      - name: Build under ASan + UBSan
        run: |
          make clean
          make ci CC=cc \
            CFLAGS="-O1 -g -D_GNU_SOURCE -Iinclude -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      # An explicit verdict from the JOB, so nothing has to be inferred from
      # whatever the last step happened to print. `if: always()` means this
      # runs even after a failure, and job.status carries the truth.
      - name: VERDICT
        if: always()
        shell: bash
        run: |
          echo "VERDICT: ${{ job.status == 'success' && 'PASS' || 'FAIL' }}"
          test "${{ job.status }}" = "success"

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install zlib + zstd (unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev libzstd-dev
          else
            brew list zstd || brew install zstd
          fi

      - name: Install (builds the native library from source)
        run: python -m pip install -v .

      # Then throw that away and install the WHEEL instead, so everything
      # below tests the artifact a user actually receives. `pip install .`
      # exercises the source path; it does not prove the wheel is complete.
      # wheels.yml builds the distributable ones, but it is tag-triggered and
      # so proves nothing on an ordinary push.
      - name: Build a wheel and install that instead
        shell: bash
        run: |
          python -m pip wheel . -w dist --no-deps
          ls -l dist
          python -m pip install --force-reinstall --no-deps dist/*.whl

      # auditwheel rejected every Linux wheel with "found the following shared
      # library/libraries in purelib folder: libgenna.so". The metadata said
      # Root-Is-Purelib: false, but the LAYOUT put the library under
      # <name>.data/purelib/ because setuptools picks purelib-vs-platlib from
      # has_ext_modules(), and a ctypes library declares none. delocate and
      # delvewheel accepted the same wheel, so only Linux was ever red -- and
      # only in a workflow that had never run. Assert the layout everywhere.
      - name: wheel layout
        shell: bash
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob('dist/*.whl')[0]
          z = zipfile.ZipFile(whl)
          names = z.namelist()
          print('wheel:', whl)

          bad = [n for n in names if '.data/purelib' in n]
          libs = [n for n in names if n.endswith(('.so', '.dll', '.dylib'))]
          wheel_meta = next(z.read(n).decode() for n in names
                            if n.endswith('.dist-info/WHEEL'))
          print(wheel_meta)
          for n in libs:
              print('  library at:', n)

          fail = []
          if bad:
              fail.append('shared library under .data/purelib/: %s' % bad)
          if not libs:
              fail.append('no native library in the wheel at all')
          if not any(n.startswith('genna/') for n in libs):
              fail.append('library is not at genna/<lib> in platlib: %s' % libs)
          if 'Root-Is-Purelib: false' not in wheel_meta:
              fail.append('WHEEL does not say Root-Is-Purelib: false')

          for f in fail:
              print('FAIL', f)
          print('VERDICT:', 'FAIL' if fail else 'PASS')
          sys.exit(1 if fail else 0)
          PY

      - name: Smoke test the installed package
        # Run from a different directory so a working import cannot be the
        # repo's own python/ directory shadowing the installed package.
        working-directory: ${{ runner.temp }}
        run: python ${{ github.workspace }}/python/tests/smoke_wheel.py

      - name: The packaged demo must run on every platform
        working-directory: ${{ runner.temp }}
        run: genna-demo --rows 2000

      # The exact sequence a new reader performs: install, then run the
      # example. From runner.temp so the repo's python/ cannot be what is
      # actually importing.
      - name: The example must run from outside the repo
        working-directory: ${{ runner.temp }}
        run: python ${{ github.workspace }}/examples/time_travel.py

      # The suite is ONE STEP PER TEST FILE on purpose. As a single loop, a
      # failure shows up only as "Full Python suite failed" -- and reading
      # which file broke needs a token, because GitHub returns 403 for
      # workflow logs unauthenticated. Split like this, the job's step names
      # name the failing test through the public API. `if: always()` so one
      # failure still leaves the rest of the matrix informative.
      #
      # test_semantic is excluded on purpose: it downloads a real
      # sentence-transformer, which is not a thing to do on every push.
      - name: extras for table/sketch
        if: always()
        run: python -m pip install "pyarrow>=12" "numpy>=1.21"

      - name: t/core
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/core python tests/test_core.py
      - name: t/threads
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/threads python tests/test_threads.py
      - name: t/query
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/query python tests/test_query.py
      - name: t/lazy
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/lazy python tests/test_lazy.py
      - name: t/table
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/table python tests/test_table.py
      - name: t/sketch
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/sketch python tests/test_sketch.py
      - name: t/demo
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/demo python tests/test_demo.py
      - name: t/ci-wiring
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/ci_wiring python tests/test_ci_wiring.py
      - name: t/format-stability
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/format python tests/test_format_stability.py
      - name: t/api-stability
        if: always()
        working-directory: python
        shell: bash
        run: bash ../tools/ci_run.sh t/api python tests/test_api_stability.py

      - name: probe-selftest
        if: always()
        # Runs AFTER the install checks on purpose. This asserts a property of
        # the build system, not of the package; when it ran first, a bug in
        # the test itself masked the thing actually being verified -- whether
        # `pip install .` works on Ubuntu 24.04 at all.
        #
        # On Linux it asserts the probe REJECTS a non-PIC archive. On
        # Windows/macOS that check reports n/a rather than counting as a pass.
        run: python tools/probe_selftest.py

      # An explicit verdict from the JOB, so nothing has to be inferred from
      # whatever the last step happened to print. `if: always()` means this
      # runs even after a failure, and job.status carries the truth.
      - name: VERDICT
        if: always()
        shell: bash
        run: |
          echo "VERDICT: ${{ job.status == 'success' && 'PASS' || 'FAIL' }}"
          test "${{ job.status }}" = "success"
