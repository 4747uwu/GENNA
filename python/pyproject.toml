[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genna"
version = "0.1.0"
description = "Versioned datasets that don't rewrite themselves: O(log n) edits, free version history, byte-exact."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Genna" }]
keywords = ["dataset", "versioning", "deduplication", "curation", "ml-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

# Semantic near-dedup runs a real sentence-transformer through onnxruntime.
# It is optional because it is the only thing here that needs a model
# download, and the core engine has no ML dependencies at all.
[project.optional-dependencies]
table = ["pyarrow>=12"]
semantic = ["onnxruntime>=1.15", "numpy>=1.21", "tokenizers>=0.15", "huggingface-hub>=0.20"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/genna-engine/genna"

[tool.setuptools]
packages = ["genna"]
