[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genna"
version = "0.1.0"
description = "Versioned datasets that don't rewrite themselves: O(log n) edits, free version history, byte-exact."
readme = "README.md"
# CI tests 3.9 and 3.12. 3.8 is EOL and was never tested, and a
# support claim with no test behind it is the thing this project
# spends its time removing.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Genna contributors" }]
keywords = ["dataset", "versioning", "deduplication", "curation", "ml-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The engine has no Python dependencies at all. Everything below is optional,
# so `pip install genna` pulls in nothing.
dependencies = []

[project.optional-dependencies]
table = ["pyarrow>=12", "numpy>=1.21"]
semantic = ["onnxruntime>=1.15", "numpy>=1.21", "tokenizers>=0.15", "huggingface-hub>=0.20"]
dev = ["pytest>=7"]

[project.scripts]
genna-demo = "genna.demo:main"
genna-example = "genna.example_time_travel:main"

[project.urls]
Homepage = "https://github.com/4747uwu/GENNA"
Source = "https://github.com/4747uwu/GENNA"

[tool.setuptools]
packages = ["genna"]

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.package-data]
genna = ["*.so", "*.dylib", "*.dll"]

# ---------------------------------------------------------------------------
# Wheels are built by cibuildwheel in CI so that `pip install genna` never
# needs a C compiler on the user's machine. The sdist can still build from
# source anywhere, which is why src/ and include/ ship inside it.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
# PyPy is skipped only because it is untested here, not because it is known
# broken -- the library is plain ctypes, so it has a fair chance of working.
skip = "pp* *-musllinux_i686 *_i686 *-win32"
build-frontend = "build"
# Import and exercise the real engine inside the built wheel, on the target
# platform. A wheel that imports but cannot round-trip is not a working wheel.
test-command = "python {project}/python/tests/smoke_wheel.py"

[tool.cibuildwheel.linux]
# zlib/zstd are detected at build time; installing them here is what gets
# compression into the Linux wheels. auditwheel then vendors them in.
# zlib is REQUIRED and must fail loudly if missing -- it is in the base
# repos of every manylinux image, so a failure here means something is
# genuinely wrong rather than merely unavailable.
#
# zstd is best-effort: libzstd-devel is not in manylinux2014's base repos
# (CentOS 7), it needs EPEL, and EPEL for a distro past EOL is not something
# to make a release depend on. The previous `|| true` covered BOTH, so a
# failed zlib install was swallowed too and the comment claiming "this is
# what gets compression into the Linux wheels" was unverified. smoke_wheel.py
# now asserts what actually made it in, per platform, inside the wheel.
before-all = """
set -e
(yum install -y zlib-devel || apk add --no-cache zlib-dev)
set +e
yum install -y epel-release && yum install -y libzstd-devel   || apk add --no-cache zstd-dev   || echo 'NOTE: zstd unavailable on this image; wheel will use zlib only'
"""

[tool.cibuildwheel.macos]
before-all = "brew list zstd || brew install zstd"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
